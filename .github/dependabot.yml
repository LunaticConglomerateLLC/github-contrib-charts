version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      dev-deps:
        patterns:
          - 'vitest'
          - 'typescript'
          - 'turbo'
      react:
        patterns:
          - 'react'
          - 'react-dom'
      octokit:
        patterns:
          - '@octokit/*'