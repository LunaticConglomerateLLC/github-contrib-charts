name: Release

# Two-phase release:
#   1. Pushes to main run release-please ONLY to open/update the Release PR
#      (no builds, no publishing).
#   2. When that Release PR is merged, it creates the vX.Y.Z tag + GitHub Release;
#      the tag push then triggers the `publish` job, which builds and publishes
#      to npmjs.com.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Phase 1 — manage the Release PR (runs only on pushes to main).
  release-pr:
    if: startsWith(github.ref, 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Phase 2 — build and publish (runs ONLY when a version tag is pushed,
  # i.e. when a Release PR is merged and the tag is created).
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm --filter @wearelunatic/github-contrib-charts build

      - name: Publish @wearelunatic/github-contrib-charts
        run: pnpm publish --filter @wearelunatic/github-contrib-charts --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
