<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Contributions React Example</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 24px;
        background: #f6f8fa;
        color: #24292f;
      }
      main {
        max-width: 820px;
        margin: 0 auto;
      }
      h1 {
        font-size: 20px;
      }
      p {
        color: #57606a;
      }
      label {
        display: inline-flex;
        flex-direction: column;
        gap: 4px;
        margin: 8px 8px 8px 0;
        font-size: 13px;
      }
      input {
        padding: 6px 8px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
      }
      button {
        margin-top: 8px;
        padding: 6px 12px;
        border: 0;
        border-radius: 6px;
        background: #2da44e;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .card {
        background: #fff;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        padding: 16px;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>GitHub Contribution Chart — plain JS example</h1>
      <p>
        This page uses <code>@wearelunatic/github-contrib-charts</code> and
        <code>@wearelunatic/github-contrib-charts</code> directly from plain React.
      </p>
      <div id="root"></div>
    </main>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
